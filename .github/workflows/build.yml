name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Afhankelijkheden (enkel esbuild)
        run: npm ci
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Artefact penningmeester.html
        uses: actions/upload-artifact@v4
        with:
          name: penningmeester-html
          path: dist/penningmeester.html
          if-no-files-found: error
      - name: Release bij een versietag (v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/penningmeester.html
